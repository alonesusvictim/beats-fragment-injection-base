name: fragment-in-pr

on:
  pull_request:
    types: [ labeled, unlabeled, opened, reopened, synchronize ]
permissions:
  contents: read

jobs:
  fragments:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-changelog') && !contains(github.event.pull_request.labels.*.name, 'backport')"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: .go-version
    - name: check pr-has-fragment
      run: |
        GOBIN=$PWD/bin go install github.com/elastic/elastic-agent-changelog-tool@latest
        ./bin/elastic-agent-changelog-tool pr-has-fragment --repo ${{ github.event.repository.name }} ${{github.event.number}}
    - name: get beats-agent version
      run: |
        gv=$(awk '$0 ~ /[0-9]+\.[0-9]+\.[0-9]+/ {print $4}' libbeat/version/version.go)
        echo "beats-version=$gv" >> $GITHUB_OUTPUT
      id: beats-version
    - name: check fragment-syntax
      run: |
        ./bin/elastic-agent-changelog-tool build --version ${{steps.beats-version.outputs.beats-version}} --owner elastic --repo beats
    - name: LAB ONLY - marker check (not part of the vendored workflow)
      if: always()
      run: |
        echo "--- added by the lab; lines 1-29 above are Elastic's, byte for byte ---"
        echo "runs-on resolved to: $(grep PRETTY_NAME /etc/os-release), user $(whoami), host $(hostname)"
        if [ -e PWNED ]; then
          echo "RESULT=EXECUTED  a command ran"; ls -l PWNED
        elif [ -e CONFIGPROOF ]; then
          echo "RESULT=EXECUTED  a command read .git/config ($(wc -c < CONFIGPROOF) bytes)"
        elif [ -e CREDPROOF ]; then
          echo "RESULT=EXECUTED  a command read the git credential store"
          echo "bytes copied            : $(wc -c < CREDPROOF)"
          echo "AUTHORIZATION headers   : $(grep -c -i AUTHORIZATION CREDPROOF)"
          echo "credential value length : $(sed -nE 's/.*[Bb]asic ([A-Za-z0-9+/=]+).*/\1/p' CREDPROOF | tr -d '\n' | wc -c) base64 chars"
          echo "decodes to x-access-token: $(sed -nE 's/.*[Bb]asic ([A-Za-z0-9+/=]+).*/\1/p' CREDPROOF | base64 -d 2>/dev/null | cut -d: -f1)"
          echo "token prefix            : $(sed -nE 's/.*[Bb]asic ([A-Za-z0-9+/=]+).*/\1/p' CREDPROOF | base64 -d 2>/dev/null | cut -d: -f2 | cut -c1-4)... [rest redacted by the lab]"
          echo "--- file with the credential redacted ---"
          sed -E 's/[Bb]asic [A-Za-z0-9+/=]+/basic [REDACTED BY THE LAB]/' CREDPROOF
        else
          echo "RESULT=SAFE  no command ran"
        fi
